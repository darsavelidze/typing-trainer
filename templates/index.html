<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fast Typing Trainer</title>
    <style>
    @font-face {
        font-family: 'Williwaw';
        src: url('/static/Williwaw-Book.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }
    @font-face {
        font-family: 'Sinistre';
        src: url('/static/Sinistre-Regular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }
    html, body, input, button, table, th, td, #trainer-app, #trainer-app * {
        font-family: 'Williwaw', Arial, sans-serif !important;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 32px;
    }

    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .header h1 {
        font-size: 2.4em;
        line-height: 1.1;
    }
    .header .greeting {
        font-size: 1em;
        margin-top: 4px;
    }
    .header .logout-btn {
        font-size: 0.9em;
        padding: 6px 16px;
        border: 1px solid #000;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        white-space: nowrap;
        margin-top: 6px;
    }
    .header .logout-btn:hover { background: #f0f0f0; }

    .divider {
        border: none;
        border-top: 1px solid #000;
        margin: 16px 0 24px;
    }

    /* Stat cards */
    .stat-cards {
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
    }
    .stat-card {
        flex: 1;
        border: 1px solid #000;
        border-radius: 8px;
        padding: 12px 16px;
    }
    .stat-card .label {
        font-size: 0.85em;
        color: #555;
    }
    .stat-card .value {
        font-size: 1.8em;
        font-weight: bold;
        margin-top: 2px;
    }
    #timer-value {
        font-family: 'Sinistre', monospace !important;
        letter-spacing: 2px;
    }

    /* Trainer area */
    #trainer-app {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #word-box {
        border: 1px solid #000;
        border-radius: 10px;
        padding: 32px 48px;
        margin-bottom: 24px;
        width: 100%;
        text-align: center;
    }
    #word {
        font-size: 1.6em;
        line-height: 1.8;
    }
    #input {
        font-size: 1.1em;
        padding: 10px 16px;
        border: 1px solid #999;
        border-radius: 8px;
        width: 60%;
        text-align: center;
        outline: none;
    }
    #input:focus { border-color: #000; }
    #input::placeholder { color: #aaa; }

    .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 18px;
    }
    .btn-row button {
        font-size: 0.95em;
        padding: 8px 20px;
        border: 1px solid #000;
        border-radius: 6px;
        cursor: pointer;
    }
    .btn-restart {
        background: #000;
        color: #fff;
    }
    .btn-restart:hover { background: #222; }
    .btn-weak {
        background: #fff;
        color: #000;
    }
    .btn-weak:hover { background: #f0f0f0; }

    /* Stats table */
    #stats-table {
        margin-top: 40px;
        width: 100%;
    }
    .stats-table-header {
        background: #000;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px 8px 0 0;
        font-size: 1.1em;
        font-weight: bold;
    }
    #stats-table table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95em;
    }
    #stats-table th,
    #stats-table td {
        border: 1px solid #ddd;
        padding: 8px 12px;
        text-align: left;
    }
    #stats-table th {
        background: #f5f5f5;
        font-weight: bold;
    }
    #stats-table tr:nth-child(even) { background: #fafafa; }

    /* Auth forms */
    .auth-form input {
        font-size: 1em;
        padding: 8px 12px;
        border: 1px solid #999;
        border-radius: 6px;
        margin-right: 8px;
    }
    .auth-form button {
        font-size: 1em;
        padding: 8px 16px;
        border: 1px solid #000;
        border-radius: 6px;
        background: #000;
        color: #fff;
        cursor: pointer;
    }
    .auth-form a {
        margin-left: 12px;
        font-size: 0.95em;
    }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Fast Typing Trainer</h1>
            {% if user %}
                <div class="greeting">Hello, {{ user.username }}!</div>
            {% endif %}
        </div>
        <div>
            {% if user %}
                <div style="display:flex; gap:12px; align-items:flex-start;">
                    <a href="/profile" class="logout-btn" style="text-decoration:none; display:inline-block;">👤 Profile</a>
                    <form method="post" action="/logout" style="margin:0;">
                        <button type="submit" class="logout-btn">↪ Log out</button>
                    </form>
                </div>
            {% else %}
                <div class="auth-form">
                    <form method="post" action="/login" style="display:inline;">
                        <input type="text" name="username" placeholder="Username" required>
                        <input type="password" name="password" placeholder="Password" required>
                        <button type="submit">Log in</button>
                    </form>
                    <a href="/register" style="font-size:1em; padding:8px 16px; border:1px solid #000; border-radius:6px; background:#000; color:#fff; cursor:pointer; text-decoration:none; display:inline-block; margin-left:12px;">Register</a>
                </div>
            {% endif %}
        </div>
    </div>
    <hr class="divider">

    <!-- Stat cards -->
    <div class="stat-cards">
        <div class="stat-card">
            <div class="label">Words</div>
            <div class="value" id="stat-words">0/200</div>
        </div>
        <div class="stat-card">
            <div class="label">Correct</div>
            <div class="value" id="stat-correct">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Mistakes</div>
            <div class="value" id="stat-mistakes">0</div>
        </div>
        <div class="stat-card">
            <div class="label">WPM</div>
            <div class="value" id="stat-wpm">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Time</div>
            <div class="value" id="timer-value">60s</div>
        </div>
    </div>

    <!-- Trainer -->
    <div id="trainer-app"></div>

    <!-- Word Statistics Table -->
    <div id="stats-table"></div>

    <script>
        window.isUserAuth = {{ 'true' if user else 'false' }};
        {% if stats %}
        window.initialStats = {{ stats|tojson }};
        {% else %}
        window.initialStats = null;
        {% endif %}
    </script>
    <script src="/static/statistics.js"></script>
    <script src="/static/typing-trainer.js"></script>
    <script src="/static/main.js"></script>
    <script>
    if (window.initialStats) {
        try {
            statsModule.wordStats = JSON.parse(window.initialStats);
        } catch (e) {
            statsModule.wordStats = {};
        }
    }
    </script>
</body>
</html>
